<style>

  /*A "shadow" button that features a 3D shadow effect and which shifts when clicked*/
  
  .shadow-button

  {

    background-color: black;

    color: white;

    font-size: 20px;

    font-weight: bold;

    padding-top: 8px;

    padding-bottom: 8px;

    padding-left: 12px;

    padding-right: 12px;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    transition: shadow 0.15s;

    box-shadow: 3px 3px 5px rgba(0,0,0,0.2);

  }

   .shadow-button:active

  {

    margin-top: 3px;

    margin-left: 3px;

    box-shadow: none;

  }

  </style>

  <button class="shadow-button">
    Shadow
  </button>
