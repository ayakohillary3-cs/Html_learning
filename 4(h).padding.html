<style>

  /* A "stretch" button that increases its width/padding when hovered over*/
  
  .stretch-button

  {

    background-color: hwb(240 34% 16%);

    color: white;

    border: none;

    border-radius: 8px;

    padding-top: 8px;

    padding-bottom: 8px;

    padding-left: 15px;

    padding-right: 15px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: padding 0.15s;

  }

  .stretch-button:hover

  {

    padding-top: 12px;

    padding-bottom: 12px;

    padding-left: 25px;

    padding-right: 25px;
  
  }

</style>

<button class="stretch-button">
  Stretch
</button>
